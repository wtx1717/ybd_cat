<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云边的小镇</title>
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
</head>
<body>
  <div class="page-shell">
    <header class="top-navigation" aria-label="顶部导航栏">
      <section class="nav-section player-section" aria-label="角色信息">
        <img class="player-avatar" src="./assets/icons/top-nav/avatar-cat-frame.png" width="448" height="448" alt="猫咪头像">
        <div class="player-info">
          <strong>LV. 23</strong>
          <div class="stat-row">
            <span>EXP</span>
            <span class="meter" aria-label="经验 320 / 900">
              <img src="./assets/images/top-nav/exp-meter.png" width="896" height="128" alt="">
              <strong class="meter-label">320 / 900</strong>
            </span>
          </div>
        </div>
      </section>

      <section class="nav-section vitals-section" aria-label="生命值与体力">
        <div class="vital-row">
          <span class="section-title">HP</span>
          <img class="status-strip hearts-strip" src="./assets/icons/top-nav/hearts-full.png" width="896" height="192" alt="生命值全满">
        </div>
        <div class="vital-row">
          <span class="section-title">体力</span>
          <img class="status-strip stamina-strip" src="./assets/icons/top-nav/stamina-full.png" width="800" height="192" alt="体力全满">
        </div>
      </section>

      <section class="nav-section wallet-section" aria-label="资源">
        <div class="resource-row">
          <img src="./assets/icons/top-nav/coin.png" width="224" height="224" alt="金币">
          <strong>1,268</strong>
        </div>
        <div class="resource-row">
          <img src="./assets/icons/top-nav/gem.png" width="224" height="224" alt="宝石">
          <strong>42</strong>
        </div>
      </section>

      <nav class="nav-section nav-links" aria-label="主导航">
        <div class="nav-menu">
          <a class="nav-item is-active" href="#overview" aria-current="page">
            <img src="./assets/icons/top-nav/home-active.png" width="448" height="448" alt="">
            <strong>首页</strong>
          </a>
          <a class="nav-item" href="#notes">
            <img src="./assets/icons/top-nav/notes-house.png" width="256" height="256" alt="">
            <strong>想法与笔记</strong>
          </a>
          <a class="nav-item" href="#projects">
            <img src="./assets/icons/top-nav/project-tavern.png" width="256" height="256" alt="">
            <strong>项目酒馆</strong>
          </a>
          <a class="nav-item" href="#tasks">
            <img src="./assets/icons/top-nav/task-cabin.png" width="256" height="256" alt="">
            <strong>任务小屋</strong>
          </a>
          <a class="nav-item" href="#training">
            <img src="./assets/icons/top-nav/running-field.png" width="256" height="256" alt="">
            <strong>跑步训练场</strong>
          </a>
          <a class="nav-item" href="#spirit">
            <img src="./assets/icons/top-nav/spirit-house.png" width="256" height="256" alt="">
            <strong>灵感小屋</strong>
          </a>
          <a class="nav-item" href="#logs">
            <img src="./assets/icons/top-nav/log-station.png" width="256" height="256" alt="">
            <strong>日志站</strong>
          </a>
          <a class="nav-item" href="#github">
            <img src="./assets/icons/top-nav/github.png" width="256" height="256" alt="">
            <strong>GitHub</strong>
          </a>
        </div>
      </nav>

      <section class="nav-section task-section" aria-label="当前任务：持续创造，跑步向前！"></section>
    </header>

    <main class="content-area" id="overview" aria-label="主题内容">
      <section class="content-panel">
        <p class="eyebrow">Main Content</p>
        <h1>主题内容区域</h1>
        <p>这里用于承载页面的核心内容，与顶部导航栏形成清晰的上下分区。</p>
      </section>
    </main>
  </div>
</body>
</html>
